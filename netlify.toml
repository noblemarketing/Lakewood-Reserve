[build]
  # Static site — install function dependencies only (no frontend build step)
  command = "npm install --omit=dev"
  publish = "."

[build.environment]
  NODE_VERSION = "20"
  # Example env file uses fake placeholders only; omit from secret scanning
  SECRETS_SCAN_OMIT_PATHS = ".env.local.example"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Stripe webhooks require the raw request body for signature verification.
[functions."webhook"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/webhook"
  to = "/.netlify/functions/webhook"
  status = 200

[[redirects]]
  from = "/api/rental-catalog"
  to = "/.netlify/functions/rental-catalog"
  status = 200
