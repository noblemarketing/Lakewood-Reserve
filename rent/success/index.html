<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Payment confirmed | Lakewood Reserve</title>
  <meta name="description" content="Your equipment rental payment was received.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/rent.css">

  <link rel="icon" type="image/png" href="/assets/icons/footer-mark-asset-1.png">
</head>
<body class="page-rent">
  <header class="site-header rent-header-minimal">
    <nav class="site-nav" aria-label="Primary navigation">
      <a class="site-logo" href="/" aria-label="Lakewood Reserve home">
        <img class="logo-full" src="/assets/icons/logo-header-asset-2.png" alt="" width="1024" height="373" loading="eager">
        <img class="logo-icon" src="/assets/icons/logo-footer-white-icon.png" alt="" width="1024" height="1024" loading="eager">
      </a>
    </nav>
  </header>

  <main id="main-content">
    <section class="rent-success-section section-fade" aria-labelledby="rent-success-title">
      <div class="section-inner">
        <div class="rent-success-panel">
          <div class="rent-success-icon" aria-hidden="true">✓</div>
          <h1 id="rent-success-title">You’re all set</h1>
          <p>Your payment was received. Your shed unlock code is on its way by text — please allow a moment for it to arrive.</p>
          <a class="btn btn-primary" href="/rent/">Back to rentals</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer rent-footer-minimal">
    <div class="section-inner footer-nav-layout">
      <div class="footer-brand-stack">
        <a class="footer-brand" href="/" aria-label="Lakewood Reserve home">
          <img src="/assets/icons/logo-footer-white-icon.png" alt="" width="1024" height="1024" loading="lazy">
        </a>
      </div>
    </div>
    <div class="footer-legal-bar">
      <div class="footer-legal-bar-inner">
        <p class="footer-copyright">© 2026 Lakewood Reserve. All rights reserved.</p>
      </div>
    </div>
  </footer>
</body>
</html>
